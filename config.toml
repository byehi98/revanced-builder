# see https://github.com/nvbangg/Patches-APK-Builder/blob/main/CONFIG.md for more detailed explanations
# and CONFIG.md in this repo for every available option.

parallel-jobs = 5
dpi = "nodpi anydpi"
remove-rv-integrations-checks = false

# ------------------------------------------------------------------------------
# App configs
#
# Every *.toml in this directory is merged into this config. Each file holds the
# app tables of a single patch author, so adding a new author is just dropping a
# new file in here - no need to touch this file. Table names must be unique across
# all of them.
#
# `imports` may also list individual files to merge, in order, for configs that
# should not live in the directory above.
# ------------------------------------------------------------------------------
app-configs = "configs"
# imports = ["extra/foo.toml"]
