# SysAdminDoc/HushTelegram
#
# Patches bundle: https://github.com/SysAdminDoc/HushTelegram
# CLI:            https://github.com/MorpheApp/morphe-cli

# every <source>-dlurl below is tried in DL_SRCS order
# (apkeep, apkcombo, apkmirror, apkpure, gplaydl, uptodown) and the next one
# is used when the current one cannot serve the required version.

# Telegram only, and only the Google Play build: the bundle targets
# `org.telegram.messenger` (version code 71831). The telegram.org build is a
# different package (`org.telegram.messenger.web`) and will not match, so the
# uptodown url points at the "Google Play version" listing and never the plain
# `telegram.en.uptodown.com` one.
[Telegram-Hush]
patches-source  = "SysAdminDoc/HushTelegram"
cli-source      = "MorpheApp/morphe-cli"
rv-brand        = "hush"
apkeep-dlurl 	= "org.telegram.messenger"
apkmirror-dlurl 	= "https://www.apkmirror.com/apk/telegram-fz-llc/telegram/"
apkpure-dlurl 	= "https://apkpure.net/telegram/org.telegram.messenger"
uptodown-dlurl 	= "https://telegram-google-play-version.en.uptodown.com/android"
# no apkcombo-dlurl: apkcombo has been failing for days, do not rely on it
# no gplaydl-dlurl: not needed, apkmirror already serves every supported version