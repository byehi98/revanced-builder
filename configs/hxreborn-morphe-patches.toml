# on apkmirror, so uptodown is the only source. uptodown slugs this app by its
# package name and now brands it "MovieBox". No apkeep-dlurl: apkeep is
# APKPure-backed, which no longer lists this package.
uptodown-dlurl  	= "https://com-community-oneroom.en.uptodown.com/android"
