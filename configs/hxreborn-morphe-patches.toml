# hxreborn/morphe-patches
#
# Patches bundle: https://github.com/hxreborn/morphe-patches
# CLI:            https://github.com/MorpheApp/morphe-cli

# every <source>-dlurl below is tried in DL_SRCS order
# (apkeep, apkcombo, apkmirror, apkpure, gplaydl, uptodown) and the next one
# is used when the current one cannot serve the required version.

[Protonmail]
patches-source  = "hxreborn/morphe-patches"
cli-source      = "MorpheApp/morphe-cli"
rv-brand        = "hxreborn"
apkeep-dlurl    	= "ch.protonmail.android"
apkcombo-dlurl  	= "https://apkcombo.com/protonmail/ch.protonmail.android/"
apkmirror-dlurl 	= "https://www.apkmirror.com/apk/proton-technologies-ag/protonmail-encrypted-email/"
apkpure-dlurl   	= "https://apkpure.net/protonmail/ch.protonmail.android"
uptodown-dlurl  	= "https://protonmail.en.uptodown.com/android"

