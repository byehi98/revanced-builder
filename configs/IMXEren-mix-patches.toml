# IMXEren/mix-patches
#
# Patches bundle: https://github.com/IMXEren/mix-patches
# CLI:            https://github.com/MorpheApp/morphe-cli

# every <source>-dlurl below is tried in DL_SRCS order
# (apkeep, apkcombo, apkmirror, apkpure, gplaydl, uptodown) and the next one
# is used when the current one cannot serve the required version.

[Trakt]
patches-source  = "IMXEren/mix-patches"
cli-source      = "MorpheApp/morphe-cli"
rv-brand        = "IMXEren"
# patches-version = "dev"
apkeep-dlurl 	= "tv.trakt.trakt"
apkcombo-dlurl 	= "https://apkcombo.com/trakt/tv.trakt.trakt/"
apkmirror-dlurl = "https://www.apkmirror.com/apk/trakt/trakt/"
apkpure-dlurl 	= "https://apkpure.net/trakt/tv.trakt.trakt"
uptodown-dlurl 	= "https://trakt.en.uptodown.com/android"
