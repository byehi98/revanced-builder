# prathxmOp/prathxm-patches
#
# Patches bundle: https://github.com/prathxmOp/prathxm-patches
# CLI:            https://github.com/MorpheApp/morphe-cli

# every <source>-dlurl below is tried in DL_SRCS order
# (apkeep, apkcombo, apkmirror, apkpure, gplaydl, uptodown) and the next one
# is used when the current one cannot serve the required version.

[Chess-com]
patches-source  = "prathxmOp/prathxm-patches"
cli-source      = "MorpheApp/morphe-cli"
rv-brand        = "Prathxm"
apkeep-dlurl    	= "com.chess"
apkcombo-dlurl  	= "https://apkcombo.com/chess-com/com.chess/"
apkmirror-dlurl 	= "https://www.apkmirror.com/apk/chess-com/chess-play-learn/"
uptodown-dlurl  	= "https://chess-play-and-learn.en.uptodown.com/android"
