# MorpheApp/morphe-patches
#
# Patches bundle: https://github.com/MorpheApp/morphe-patches
# CLI:            https://github.com/MorpheApp/morphe-cli

# every <source>-dlurl below is tried in DL_SRCS order
# (apkeep, apkcombo, apkmirror, apkpure, gplaydl, uptodown) and the next one
# is used when the current one cannot serve the required version.

[YouTube-Morphe]
patches-source 		= "MorpheApp/morphe-patches"
cli-source 			= "MorpheApp/morphe-cli"
rv-brand 			= "morphe"
apkeep-dlurl    	= "com.google.android.youtube"
apkcombo-dlurl  	= "https://apkcombo.com/youtube-morphe/com.google.android.youtube/"
apkmirror-dlurl 	= "https://www.apkmirror.com/apk/google-inc/youtube/"
apkpure-dlurl   	= "https://apkpure.net/youtube-morphe/com.google.android.youtube"
uptodown-dlurl  	= "https://youtube.en.uptodown.com/android"

[YouTube-Morphe-Dev]
patches-source 		= "MorpheApp/morphe-patches"
cli-source 			= "MorpheApp/morphe-cli"
rv-brand 			= "morphe-dev"
patches-version 	= "dev"
version				= "experiment"
apkeep-dlurl    	= "com.google.android.youtube"
apkcombo-dlurl  	= "https://apkcombo.com/youtube-morphe-dev/com.google.android.youtube/"
apkmirror-dlurl 	= "https://www.apkmirror.com/apk/google-inc/youtube/"
apkpure-dlurl   	= "https://apkpure.net/youtube-morphe-dev/com.google.android.youtube"
uptodown-dlurl  	= "https://youtube.en.uptodown.com/android"

