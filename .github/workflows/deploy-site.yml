name: Deploy Obtainium Catalog

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/generate_site.py'
      - '.github/workflows/deploy-site.yml'
  release:
    types: [published]
  workflow_run:
    workflows: ["Update README Build Status"]
    types: [completed]
  schedule:
    # safety net for lost workflow_run events and to refresh download counts
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # workflow_run also fires for failed README updates; don't publish stale data
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/generate_site.py
          --repo "${{ github.repository }}"
          --output site/data.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
