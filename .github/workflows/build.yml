name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  run:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: build
      cancel-in-progress: false
    env:
      # tells utils.sh the bypass solver is already running as a service
      # container, so it skips the on-demand `docker run` path entirely
      CF_SOLVER_URL: http://localhost:8000
    services:
      cf-solver:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Restore stock APK cache
        uses: actions/cache/restore@v6
        with:
          path: |
            temp/*.apk
            temp/*.apkm
            temp/apkeditor.jar
            temp/cache_manifest.txt
          key: apks-${{ github.run_id }}
          restore-keys: |
            apks-

      - name: Install tools
        run: |
          curl -sL https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu -o apkeep
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/apkeep
          sudo apt-get install -y aapt
          pipx install gplaydl

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ -n "$UPDATE_CFG" ]; then
              echo "$UPDATE_CFG" > config.json
            fi
          fi


      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Build modules/APKs
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          APK_KEEP_TOKEN: ${{ secrets.APK_KEEP_TOKEN }}
          APK_KEEP_EMAIL: ${{ secrets.APK_KEEP_EMAIL }}

      - name: Prune stock APK cache
        if: always()
        run: .github/scripts/apk_cache.sh temp prune

      - name: Write cache manifest
        if: always()
        run: .github/scripts/apk_cache.sh temp manifest

      - name: Save stock APK cache
        if: always() && hashFiles('temp/cache_manifest.txt') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            temp/*.apk
            temp/*.apkm
            temp/apkeditor.jar
            temp/cache_manifest.txt
          key: apks-${{ hashFiles('temp/cache_manifest.txt') }}

      - name: Generate build report
        run: |
          source utils.sh
          set_prebuilts
          if [ -f config.json ]; then
            toml_prep config.json
          else
            toml_prep config.toml
          fi
          echo "$__TOML__" > config_full.json

          cat << 'EOF' > gen_report.py
          import json
          import os

          with open("config_full.json", "r") as f:
              config = json.load(f)

          built_files = set(os.listdir("build")) if os.path.isdir("build") else set()
          failed = []

          for table, data in config.items():
              if not isinstance(data, dict):
                  continue
              enabled = data.get("enabled", True)
              if enabled == False or enabled == "false":
                  continue
              app_name = data.get("app-name", table)
              app_name_l = app_name.lower().replace(" ", "-")

              main_rv_brand = config.get("rv-brand", "ReVanced")
              rv_brand = data.get("rv-brand", main_rv_brand)
              rv_brand_f = rv_brand.lower().replace(" ", "-")

              prefix = f"{app_name_l}-{rv_brand_f}"

              if not any(f.startswith(prefix) for f in built_files):
                  failed.append(table)

          if failed:
              os.makedirs("build", exist_ok=True)
              with open("build/failed.txt", "w") as f:
                  f.write("\n".join(failed))
              print("Failed apps:")
              for t in failed:
                  print(f"  - {t}")
              if os.path.exists("build.md"):
                  with open("build.md", "a") as f:
                      f.write("\n\n### Failed to build\n")
                      for t in failed:
                          f.write(f"- ❌ `{t}`\n")
          else:
              print("All apps built successfully.")
          EOF
          python3 gen_report.py

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          [ -f build.md ] && cat build.md >> "$GITHUB_OUTPUT" || true
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          [ -f build.md ] && cp -f build.md build.tmp || true
      
      - name: Generate package_ids.json
        run: |
          source utils.sh
          set_prebuilts
          if [ -f config.json ]; then
            toml_prep config.json
          else
            toml_prep config.toml
          fi
          echo "$__TOML__" > config_full.json
          
          cat << 'EOF' > gen_pkg_ids.py
          import json
          import os
          import subprocess
          import re
          
          with open("config_full.json", "r") as f:
              config = json.load(f)
              
          package_ids = {}
          built_files = os.listdir("build") if os.path.isdir("build") else []
          
          for table, data in config.items():
              if not isinstance(data, dict):
                  continue
              app_name = data.get("app-name", table)
              app_name_l = app_name.lower().replace(" ", "-")
              
              main_rv_brand = config.get("rv-brand", "ReVanced")
              rv_brand = data.get("rv-brand", main_rv_brand)
              rv_brand_f = rv_brand.lower().replace(" ", "-")
              
              prefix = f"{app_name_l}-{rv_brand_f}"
              
              for f in built_files:
                  if f.startswith(prefix) and f.endswith(".apk"):
                      try:
                          out = subprocess.check_output(["aapt", "dump", "badging", os.path.join("build", f)]).decode("utf-8")
                          m = re.search(r"package: name='([^']+)'", out)
                          if m:
                              package_ids[app_name_l] = m.group(1)
                      except Exception:
                          pass
                      break
                      
          with open("build/package_ids.json", "w") as f:
              json.dump(package_ids, f)
          EOF
          python3 gen_pkg_ids.py
      
      - name: Upload release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
          UPLOAD_CONCURRENCY: "12"
        run: |
          if ! compgen -G 'build/*.apk' >/dev/null && ! compgen -G 'build/*.zip' >/dev/null; then
            echo "No builds succeeded, skipping release!"
            exit 0
          fi

          upload_one() {
            local f="$1" attempt
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            echo "::error::Failed to upload ${f}"
            return 1
          }
          export -f upload_one
          export TAG

          mapfile -t files < <(find build -maxdepth 1 -type f | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Release" --notes "$BODY"
            rest=("${files[@]}")
          else
            # seed the release with the first asset so it is never asset-less
            gh release create "$TAG" "${files[0]}" --title "Release" --notes "$BODY"
            rest=("${files[@]:1}")
          fi

          if [ "${#rest[@]}" -gt 0 ]; then
            printf '%s\0' "${rest[@]}" |
              xargs -0 -P "$UPLOAD_CONCURRENCY" -n 1 bash -c 'upload_one "$@"' _
          fi

      - name: Update modules changelog and update json
        id: update_config
        run: |
          if ! compgen -G 'build/*.apk' >/dev/null && ! compgen -G 'build/*.zip' >/dev/null; then
            echo "No builds succeeded, skipping changelog update."
            exit 0
          fi
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        run: |
          if ! compgen -G 'build/*.apk' >/dev/null && ! compgen -G 'build/*.zip' >/dev/null; then
            echo "No builds succeeded, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add build.md *-update.json
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        if: env.TG_TOKEN != null
        run: |
          if ! compgen -G 'build/*.apk' >/dev/null && ! compgen -G 'build/*.zip' >/dev/null; then
            echo "No builds succeeded, skipping Telegram report."
            exit 0
          fi
          cd build || { echo "build folder not found"; exit 1; }

          TG_CHAT="@rvc_magisk"
          NL=$'\n'
          APKS=""
          MODULES=""
          for OUTPUT in *; do
            DL_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            if [[ $OUTPUT = *.apk ]]; then
              APKS+="${NL}📦[${OUTPUT}](${DL_URL})"
            elif [[ $OUTPUT = *.zip ]]; then
              MODULES+="${NL}📦[${OUTPUT}](${DL_URL})"
            fi
          done
          MODULES=${MODULES#"$NL"}
          APKS=${APKS#"$NL"}

          BODY="$(sed 's/^\* \*\*/↪ \*\*/g; s/^\* `/↪ \*\*/g; s/`/\*/g; s/^\* /\↪/g; s/\*\*/\*/g; s/###//g; s/^- /↪ /g; /^==/d;' ../build.md)"
          MSG="*New build!*

          ${BODY}

          *▼ Download Links:*
          Modules:
          ${MODULES}

          APKs:
          ${APKS}
          "
          echo "'$MSG'"
          MSG=${MSG:0:9450}
          POST="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          curl -X POST --data-urlencode "parse_mode=Markdown" --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${MSG}" --data-urlencode "chat_id=${TG_CHAT}" "$POST"
