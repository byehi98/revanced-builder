name: Add App Config

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name (e.g. YouTube, Reddit, or package name)"
        required: true
        type: string
      patch_source:
        description: "Patch source repository in owner/repo format (e.g. MorpheApp/morphe-patches)"
        required: true
        type: string
      package_name:
        description: "Android package name (optional, automatically resolved if left empty)"
        required: false
        type: string

jobs:
  add-app:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add App Configuration
        id: add
        run: |
          chmod +x ./add-app.sh ./scripts/add_app.py
          OUTPUT=$(./add-app.sh "${{ inputs.app_name }}" "${{ inputs.patch_source }}" "${{ inputs.package_name }}")
          printf '%s\n' "$OUTPUT"
          TABLE=$(printf '%s\n' "$OUTPUT" | sed -n 's/^\[+\] Successfully added table \[\(.*\)\] to .*$/\1/p' | tail -n1)
          if [ -z "$TABLE" ]; then
            echo "::error::Could not determine the table name that was added"
            exit 1
          fi
          echo "table=$TABLE" >> "$GITHUB_OUTPUT"

      - name: Validate Configurations
        run: |
          chmod +x ./bin/toml/tq-x86_64
          ./build.sh --list-apps

      - name: Commit and Push Changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add configs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add ${{ inputs.app_name }} with patch source ${{ inputs.patch_source }}"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # build has to be dispatched explicitly. workflow_dispatch is the one
      # event GITHUB_TOKEN is allowed to start.
      - name: Trigger CI build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run ci.yml --ref main \
                -f force_build=true \
                -f app="${{ steps.add.outputs.table }}"; then
              echo "Dispatched CI build for the new app."
              exit 0
            fi
            echo "CI dispatch attempt ${attempt} failed, retrying..."
            sleep 5
          done
          echo "::error::Could not dispatch ci.yml"
          exit 1
