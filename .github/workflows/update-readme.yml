name: Update README Build Status

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Matrix Build Modules", "CI", "Build Modules"]
    types:
      - completed
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install tools
        run: sudo apt-get install -y jq curl
        
      - name: Generate config.json
        run: |
          source utils.sh
          set_prebuilts
          toml_prep config.toml
          echo "$__TOML__" > config.json

      - name: Fetch build.md
        run: wget https://raw.githubusercontent.com/${{ github.repository }}/update/build.md -O build.md || touch build.md

      - name: Generate Build Status Table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > generate_table.py
          import json
          import sys
          import subprocess
          import os
          import urllib.parse
          
          with open("config.json", "r") as f:
              config = json.load(f)
              
          try:
              release_info = subprocess.check_output(["gh", "release", "view", "--json", "tagName,assets"]).decode("utf-8")
              release_data = json.loads(release_info)
              tag = release_data["tagName"]
              built_files = [a["name"] for a in release_data["assets"]]
              
              if "package_ids.json" in built_files:
                  subprocess.check_call(["gh", "release", "download", tag, "-p", "package_ids.json", "--clobber"])
                  with open("package_ids.json", "r") as pf:
                      package_ids = json.load(pf)
              else:
                  package_ids = {}
          except Exception:
              tag = ""
              built_files = []
              package_ids = {}
              
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          
          with open("README.md", "r") as rfile:
              readme_lines = rfile.readlines()
              
          old_data = {}
          in_table = False
          has_patch_ver_col = False
          for line in readme_lines:
              if "<!-- BUILD_STATUS_START -->" in line:
                  in_table = True
                  continue
              if "<!-- BUILD_STATUS_END -->" in line:
                  break
              if in_table and line.startswith("|") and "Patches Source" in line and "Patch Version" in line:
                  has_patch_ver_col = True
                  continue
              if in_table and line.startswith("|") and not line.startswith("| Patches") and not line.startswith("| :---"):
                  parts = [p.strip() for p in line.split("|")]
                  if has_patch_ver_col and len(parts) >= 7:
                      config_table = parts[4].strip("`")
                      old_data[config_table] = {
                          "patch_ver": parts[2].strip("`") if parts[2] != "Unknown" else "Unknown",
                          "status": parts[3],
                          "app_display": parts[5]
                      }
                  elif not has_patch_ver_col and len(parts) >= 6:
                      config_table = parts[3].strip("`")
                      old_data[config_table] = {
                          "patch_ver": "Unknown",
                          "status": parts[2],
                          "app_display": parts[4]
                      }

          patch_versions = {}
          try:
              with open("build.md", "r") as bf:
                  for line in bf:
                      line = line.strip()
                      if line.startswith("Patches: "):
                          parts = line.split("Patches: ")[1].split("/")
                          if len(parts) >= 2:
                              author = parts[0].lower()
                              filename = parts[1].strip()
                              patch_versions[author] = filename
          except Exception:
              pass

          print("| Patches Source | Patch Version | Status | Config | App | Obtainium |")
          print("| :--- | :--- | :---: | :--- | :--- | :---: |")
          
          def_patch_src = config.get("patches-source") or config.get("patches-sources") or "ReVanced/revanced-patches"
          
          for table, data in config.items():
              if not isinstance(data, dict):
                  continue
              
              enabled = data.get("enabled", True)
              if enabled == False or enabled == "false":
                  continue
                  
              app_name = data.get("app-name", table)
              main_rv_brand = config.get("rv-brand", "ReVanced")
              rv_brand = data.get("rv-brand", main_rv_brand)
              
              app_name_l = app_name.lower().replace(" ", "-")
              rv_brand_f = rv_brand.lower().replace(" ", "-")
              
              prefix = f"{app_name_l}-{rv_brand_f}"
              
              matching_files = [f for f in built_files if f.startswith(prefix)]
              success = len(matching_files) > 0
              patches_source = data.get("patches-source") or data.get("patches-sources") or def_patch_src
              
              if patches_source.startswith("GitLab:"):
                  src_author = patches_source.split(":")[1].split("/")[0].lower()
              else:
                  src_author = patches_source.split("/")[0].lower()
              patch_ver = patch_versions.get(src_author)

              if success and tag:
                  status = "✅"
                  file_links = []
                  for f in matching_files:
                      url = f"https://github.com/{repository}/releases/download/{tag}/{f}"
                      if f.endswith(".apk"):
                          file_links.append(f"[APK]({url})")
                      elif f.endswith(".zip"):
                          file_links.append(f"[Module]({url})")
                      else:
                          file_links.append(f"[File]({url})")
                  links_str = " ".join(file_links)
                  app_display = f"{app_name} ({links_str})"
                  if not patch_ver:
                      patch_ver = "Unknown"
              else:
                  old_info = old_data.get(table)
                  if old_info and old_info["status"] == "✅":
                      status = "✅"
                      app_display = old_info["app_display"]
                      if not patch_ver or patch_ver == "Unknown":
                          patch_ver = old_info["patch_ver"]
                  else:
                      status = "❌"
                      app_display = app_name
                      if not patch_ver:
                          patch_ver = old_info["patch_ver"] if old_info else "Unknown"
              
              dummy_id = package_ids.get(app_name_l, f"app.revanced.builder.{app_name_l}")
              author = repository.split('/')[0] if '/' in repository else "Unknown"
              additional_settings = json.dumps({
                  "apkFilterRegEx": prefix,
                  "autoApkFilterByArch": True
              }, separators=(',', ':'))
              
              obtainium_json = json.dumps({
                  "id": dummy_id,
                  "url": f"https://github.com/{repository}",
                  "author": author,
                  "name": app_name,
                  "additionalSettings": additional_settings
              }, separators=(',', ':'))
              encoded_json = urllib.parse.quote(obtainium_json)
              obtainium_link = f"https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/{encoded_json}"
              obtainium_badge = f"[![Obtainium](https://img.shields.io/badge/Obtainium-4500FF?style=flat-square&logo=obtainium&logoColor=%23FFFFFF)]({obtainium_link})"
              
              patch_ver_display = f"`{patch_ver}`" if patch_ver != "Unknown" else "Unknown"
              
              print(f"| `{patches_source}` | {patch_ver_display} | {status} | `{table}` | {app_display} | {obtainium_badge} |")
          EOF
          
          python3 generate_table.py > table.md
          
          awk '
          BEGIN { p = 1 }
          /<!-- BUILD_STATUS_START -->/ { print; system("cat table.md"); p = 0 }
          /<!-- BUILD_STATUS_END -->/ { p = 1 }
          p { print }
          ' README.md > README.md.tmp
          mv README.md.tmp README.md
          
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update build status table [skip ci]"
            git push
          else
            echo "no changes to README.md"
          fi
