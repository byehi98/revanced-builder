name: CI
on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build even if no config updates are detected (used after adding an app)"
        required: false
        type: boolean
        default: false
      app:
        description: "Only build this app table (optional; used after adding an app)"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "11 0 * * *"
    - cron: "46 4 * * *"
    - cron: "08 8 * * *"
    - cron: "52 12 * * *"
    - cron: "29 16 * * *"
    - cron: "03 20 * * *"

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Should build?
        id: should_build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
          APP: ${{ inputs.app }}
        run: |
          if [ "$FORCE_BUILD" = "true" ]; then
            echo "Forced build requested."
            if [ -n "$APP" ]; then
              echo "Building only '$APP'."
              if ! ./build.sh --list-apps | grep -qxF -- "$APP"; then
                echo "::error::App table '$APP' is not present in the config"
                exit 1
              fi
            fi
            echo "SHOULD_BUILD=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          if ! git checkout origin/update build.md; then
            echo "first time building!"
            echo "SHOULD_BUILD=1" >> $GITHUB_OUTPUT
          else
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [[ "$UPDATE_CFG" != *"[-] No updates found"* ]] && [ -n "$UPDATE_CFG" ]; then
              echo "'$UPDATE_CFG'"
              echo "SHOULD_BUILD=1" >> $GITHUB_OUTPUT
            else
              echo "SHOULD_BUILD=0" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

    outputs:
      SHOULD_BUILD: ${{ steps.should_build.outputs.SHOULD_BUILD }}

  build:
    permissions:
      contents: write
    needs: check
    uses: ./.github/workflows/build.yml
    if: ${{ needs.check.outputs.SHOULD_BUILD == 1 }}
    with:
      app: ${{ inputs.app }}
    secrets: inherit
